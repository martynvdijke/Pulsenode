<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/auth.css" rel="stylesheet">
    <link href="/static/css/eink.css" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <h4 class="text-center mb-4">Synapse Login</h4>
        <div id="error" class="alert alert-danger d-none"></div>
        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div id="oidc-block" class="d-none mt-3">
            <hr>
            <a href="/api/auth/oidc/login" class="btn btn-outline-primary w-100">Login with Authelia</a>
        </div>
    </div>
    <script src="/static/js/eink.js"></script>
    <script>
        fetch('/api/auth/oidc/status').then(r => r.json()).then(s => {
            if (s.enabled) document.getElementById('oidc-block').classList.remove('d-none');
        }).catch(() => {});
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const errorDiv = document.getElementById('error');
            errorDiv.classList.add('d-none');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: fd.get('username'),
                    password: fd.get('password')
                })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                const err = await res.json();
                errorDiv.textContent = err.error || 'Invalid credentials';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
