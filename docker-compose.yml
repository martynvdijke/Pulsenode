services:
  synapse:
    build: .
    container_name: synapse
    ports:
      - "6270:6270"
    volumes:
      # Persistent SQLite database
      - synapse-db:/db
      # Mount your docker-compose files for Synapse to discover services
      - /var/docker/compose:/compose:ro
      # Optional: mount Authelia config if using Authelia sync
      # - ./authelia:/config/authelia:ro
      # Optional: mount the Docker socket to track container events
      # (restarts, image updates) and notify on unexpected stops.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DB_PATH: /db/synapse.db
      COMPOSE_PATH: /compose/docker-compose.yml
      LISTEN_ADDR: :6270
      # DEPRECATED: NPM instances are now configured via the web UI Settings tab.
      # These legacy env vars are only used for migration on first startup.
      # NPM_HOST: http://npm:81
      # NPM_USER: admin@example.com
      # NPM_PASS: changeme
      # Optional: connect to Uptime Kuma
      # KUMA_URL: http://uptime-kuma:3001
      # KUMA_USER: admin
      # KUMA_PASS: changeme
      # Optional: Authelia sync
      # AUTHELIA_CONFIG_PATH: /config/authelia/configuration.yml
      # AUTHELIA_DB_PATH: /config/authelia/db.sqlite3
      # AUTHELIA_SYNC_ENABLED: "true"
      # Optional: Authelia OIDC login for synapse's own UI/API
      # (Authorization Code + PKCE S256 via coreos/go-oidc).
      # This synapse is NOT Matrix Synapse — native Matrix OIDC is out of scope.
      # OIDC_ISSUER: https://authelia.vandijke.xyz
      # OIDC_CLIENT_ID: synapse
      # OIDC_CLIENT_SECRET: changeme  # or mount a secret file + OIDC_CLIENT_SECRET_FILE
      # OIDC_REDIRECT_URL: https://synapse.example.com/api/auth/oidc/callback
      # OIDC_SCOPES: "openid email profile groups"
      # Optional: periodic sync interval (minutes, 0 = manual only)
      # SYNC_INTERVAL: 60
      # Optional: Docker event tracking (requires the socket mount above)
      # DOCKER_SOCKET: unix:///var/run/docker.sock
      # DOCKER_EVENTS_ENABLED: "true"
      # DOCKER_EVENTS_RETENTION_DAYS: 30
      # Optional: periodic reconciliation of linked services (dry run by default)
      # RECONCILE_ENABLED: "true"
      # RECONCILE_INTERVAL_MINUTES: 60
      # RECONCILE_DRY_RUN_DEFAULT: "true"
      # Optional: Gotify event notifications (requires GOTIFY_URL/GOTIFY_TOKEN)
      # NOTIFY_DOCKER_DIE: "true"
      # NOTIFY_DOCKER_HEALTH: "true"
      # NOTIFY_DOCKER_IMAGE: "true"
      # NOTIFY_RECONCILE: "true"
      # NOTIFY_COOLDOWN_MINUTES: 5
      # Optional: OpenTelemetry
      # OTEL_ENABLED: "true"
      # OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
    restart: unless-stopped

volumes:
  synapse-db:
